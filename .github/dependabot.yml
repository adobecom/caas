version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"

    # Check each weekday morning so safe updates can flow continuously.
    # Security updates are advisory-triggered and do not wait for this schedule.
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Los_Angeles"

    # Limit: Max 10 open version-update PRs at once.
    # Security updates use GitHub's separate limit.
    open-pull-requests-limit: 10

    # The serial safe-automerge controller updates only the PR that currently
    # owns the queue slot. Do not rebase all open Dependabot PRs after each merge.
    rebase-strategy: "disabled"

    # No grouping: Dependabot will open individual PRs per update

    # Safety: Ignore major version bumps (too risky to auto-update)
    # We'll handle React 16→18, Webpack 3→5 manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
