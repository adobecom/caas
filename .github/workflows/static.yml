# .github/workflows/static.yml
name: Deploy static content to Pages

on:
  # Runs on pushes to the main branch (i.e. after merges)
  push:
    branches: [ "main" ]

  # Allows manual dispatch from the Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages in the new model
permissions:
  contents: read
  pages: write
  id-token: write
  # Read this run's artifact list before deploying.
  actions: read

# Only one deployment to GitHub Pages can be in progress
concurrency:
  group: "pages"
  cancel-in-progress: true

# Retry package downloads when the registry connection drops (ECONNRESET and
# similar). Applies to every npm command in this workflow, in CI only.
env:
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_mintimeout: 20000
  npm_config_fetch_retry_maxtimeout: 120000

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js since we need to build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install dependencies and build
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 4. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      # 5. Collect only the files the site serves: everything tracked in git
      #    plus the fresh build in dist/. Uploading the whole checkout also sent
      #    node_modules (~168 MB, tens of thousands of files), and deploy-pages
      #    often failed to find that artifact ("Fetching artifact metadata failed").
      - name: Collect site files
        run: |
          rm -rf _site && mkdir _site
          git ls-files -z | xargs -0 cp --parents -t _site
          cp -R dist/. _site/dist/
          du -sh _site

      # 6. Upload the site files to the Pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: 'github-pages'

      # 7. GitHub lists a new artifact a moment after the upload reports it
      #    finalized. deploy-pages looks it up immediately and fails with
      #    "Found 0 artifact(s)" when it is not listed yet, so wait until it is.
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '.total_count')
            if [ "${count:-0}" -ge 1 ]; then
              echo "$ARTIFACT is listed (check $i)."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::$ARTIFACT was still not listed after 60 seconds; trying the deploy anyway."

      # 8. Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'github-pages'

      # 9. Retry once if the deploy failed; the job still fails if this fails.
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'github-pages'
