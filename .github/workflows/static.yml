# .github/workflows/static.yml
name: Deploy static content to Pages

on:
  # Runs on pushes to the main branch (i.e. after merges)
  push:
    branches: [ "main" ]

  # Allows manual dispatch from the Actions tab
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to publish (blank = normal site deployment)'
        type: string
        required: false
      node_version:
        description: 'Node version for the PR build'
        type: string
        default: '24'

# Permissions required for GitHub Pages in the new model
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pr-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    uses: ./.github/workflows/pr-preview.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      node_version: ${{ inputs.node_version }}
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: write
      id-token: write
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.pr_number == ''
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js since we need to build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install dependencies and build
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Include retained PR previews
        run: |
          status=0
          git ls-remote --exit-code --heads origin qa-previews > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch origin qa-previews
            git archive FETCH_HEAD pr-builds | tar -x
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      # 4. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 5. Upload our site files to the Pages artifact
      #    - Our index.html is in the repo root, so we use 'path: "."'.
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: 'github-pages'

      # 6. Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'github-pages'
