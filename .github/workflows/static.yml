# .github/workflows/static.yml
name: Deploy static content to Pages

on:
  # Runs on pushes to the main branch (i.e. after merges)
  push:
    branches: [ "main" ]

  # Allows manual dispatch from the Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages in the new model
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment to GitHub Pages can be in progress
concurrency:
  group: "pages"
  cancel-in-progress: true

# Retry package downloads when the registry connection drops (ECONNRESET and
# similar). Applies to every npm command in this workflow, in CI only.
env:
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_mintimeout: 20000
  npm_config_fetch_retry_maxtimeout: 120000

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js since we need to build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install dependencies and build
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 4. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      # 5. Collect only the files the site serves: everything tracked in git
      #    plus the fresh build in dist/. Uploading the whole checkout also sent
      #    node_modules (~168 MB, tens of thousands of files), and deploy-pages
      #    often failed to find that artifact ("Fetching artifact metadata failed").
      - name: Collect site files
        run: |
          rm -rf _site && mkdir _site
          git ls-files -z | xargs -0 cp --parents -t _site
          cp -R dist/. _site/dist/
          du -sh _site

      # 6. Upload the site files to the Pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: 'github-pages'

      # 7. Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'github-pages'