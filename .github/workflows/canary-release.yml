name: Create Canary Release

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: canary-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ready-for-canary') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready-for-canary')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Name immutable trial version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+(?:\.\d+)?$/.test(base)) throw new Error('Invalid base version');
          const version = `${base}-canary.pr${process.env.PR_NUMBER}.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: npm ci
      - name: Build with 10% diagnostic sampling
        run: npm run build
        env:
          CAAS_DIAGNOSTIC_SAMPLE_RATE: '10'
          RELEASE_TAG: ${{ steps.version.outputs.version }}
      - name: Package build
        run: tar -czf dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: canary-package
          path: dist.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Never execute PR code in the job holding a release-writing token.
      - uses: actions/download-artifact@v4
        with:
          name: canary-package
          path: package
      - name: Publish the exact PR commit as a prerelease
        uses: actions/github-script@v7
        env:
          TRIAL_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number,
            });
            if (current.state !== 'open' || current.head.sha !== pr.head.sha ||
                !current.labels.some(label => label.name === 'ready-for-canary')) {
              core.notice('PR changed, closed, or label removed; no release published.');
              return;
            }
            const tag = process.env.TRIAL_VERSION;
            const suffix = `-canary.pr${pr.number}.${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}`;
            if (!tag.endsWith(suffix) || !/^\d+\.\d+\.\d+(?:\.\d+)?-canary\.pr\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error('Invalid canary tag');
            }
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/${tag}`, sha: pr.head.sha,
            });
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: pr.head.sha,
              name: tag, prerelease: true, make_latest: 'false',
              body: `Trial build for PR #${pr.number}\nSource: ${pr.head.sha}\nDiagnostic sample rate: 10%\n\nRequires the existing Rundeck publishing step before use with caasver. No stable deployment or CMR is triggered by this workflow.`,
            });
            const fs = require('node:fs');
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name: 'dist.tar.gz',
              data: fs.readFileSync('package/dist.tar.gz'),
            });
            await core.summary.addHeading('Canary package created')
              .addLink(tag, release.html_url)
              .addRaw(`\n\nSource: ${pr.head.sha}\n\nDiagnostic sampling: 10%. Publish through Rundeck before using caasver.`)
              .write();
