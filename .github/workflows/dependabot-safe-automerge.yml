name: Dependabot Safe Autonomy

on:
  # A merge changes the base for every remaining Dependabot PR. Wake the
  # controller immediately so it can advance the next item in the queue.
  push:
    branches: [main]
  # Re-evaluate after every workflow that can change the PR's merge state.
  # Build output can finish before the required and advisory checks, so it
  # cannot be the only completion event that wakes this controller.
  workflow_run:
    workflows:
      - Build Output Diff (advisory)
      - Pull Request
      - Review Score Gate
      - AI Code Review
      - Agent QA Review
      - Feature QA Review
    types: [completed]
  # The QA reviewer's "QA result:" comment can clear (or withdraw) a QA PASS. issue_comment
  # always runs this file from the default branch, never from the PR.
  issue_comment:
    types: [created, edited]
  # Backup for conflict recovery. Scheduled Actions may be delayed or dropped,
  # so normal ready-to-merge processing must not depend on this timer.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-safe-autonomy
  cancel-in-progress: false

# This privileged controller always executes the version on main. It never
# checks out or executes Dependabot PR code; it only reads API results, labels,
# comments, and enables native auto-merge.
permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  evaluate:
    # Comments only wake the controller when they are the QA reviewer's QA
    # result on a pull request (PASS, or a later result that withdraws one);
    # every other comment is ignored.
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request &&
        github.event.comment.user.login == (vars.DEPENDABOT_QA_REVIEWER || 'sanrai') &&
        contains(github.event.comment.body, 'QA result:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Whose QA PASS comment (naming the exact head SHA) may override the
      # byte-identical bundle rule and non-required check failures.
      QA_REVIEWER: ${{ vars.DEPENDABOT_QA_REVIEWER || 'sanrai' }}
      GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Absent/anything except "merge" records decisions without merging.
      # The live repository currently controls this through the named variable.
      AUTOMERGE_MODE: ${{ vars.DEPENDABOT_AUTOMERGE_MODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test policy evaluator
        run: node --test .github/dependabot/safe-automerge.test.mjs

      - name: Evaluate PRs, recover conflicts, and arm one safe merge
        run: node .github/dependabot/safe-automerge.mjs
