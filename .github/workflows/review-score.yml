name: Review Score Gate
"on":
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  pull-requests: read
  statuses: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Compute + post review-score status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat > "$RUNNER_TEMP/review-score.js" <<'SCRIPT'
          const { execSync, spawnSync } = require('child_process');
          const ALLOWED_VOTERS = [
            'auniverseaway', 'chrischrischris', 'cmiqueo', 'honstar',
            'jedjedjedM', 'jenssingler', 'raissanjay', 'sanrai',
            'sheridansunier', 'shkhan91', 'sukamat',
          ];
          const REQUIRED_SCORE = 1;
          const repo = process.env.REPO;
          const pr = process.env.PR_NUMBER;
          const sha = process.env.HEAD_SHA;
          const author = (process.env.PR_AUTHOR || '').toLowerCase();
          if (!pr || !sha) { console.log('no pull_request context; skipping'); process.exit(0); }
          const voters = new Set(ALLOWED_VOTERS.map(function (s) { return s.toLowerCase(); }));
          const raw = execSync('gh api "repos/' + repo + '/pulls/' + pr + '/reviews?per_page=100" --paginate',
            { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          const reviews = JSON.parse(raw);
          const latest = new Map();
          for (const r of reviews) {
            const l = ((r.user && r.user.login) || '').toLowerCase();
            if (!l || l === author || !voters.has(l)) continue;
            if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') latest.set(l, r.state);
            else if (r.state === 'DISMISSED') latest.delete(l);
          }
          let a = 0, b = 0;
          for (const s of latest.values()) { if (s === 'APPROVED') a++; else b++; }
          const score = a - b;
          // Deterministic fast-path: a dev-dependency bump whose shipped bundle is
          // byte-identical to base is provably behavior-neutral, so the build-output-diff
          // NO_CHANGE verdict may stand in for a human approval. ONLY deps-dev + NO_CHANGE
          // qualifies; every other PR still needs a human vote.
          let fastPass = false;
          if (score < REQUIRED_SCORE) {
            let title = '', ref = '';
            try {
              const prObj = JSON.parse(execSync('gh api "repos/' + repo + '/pulls/' + pr + '"', { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 }));
              title = prObj.title || '';
              ref = (prObj.head && prObj.head.ref) || '';
            } catch (e) {}
            const isDepsDev = /deps-dev/i.test(title) || (/dependabot/i.test(author) && /dependabot\//.test(ref));
            if (isDepsDev) {
              const readVerdict = function () {
                try {
                  const st = JSON.parse(execSync('gh api "repos/' + repo + '/commits/' + sha + '/statuses?per_page=100"', { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 })).find(function (x) { return x.context === 'build-output-diff'; });
                  if (st && /NO_CHANGE/i.test(st.description || '')) return 'NO_CHANGE';
                  if (st && /CHANGED/i.test(st.description || '')) return 'CHANGED';
                } catch (e) {}
                return null;
              };
              const runState = function () {
                try {
                  const list = (JSON.parse(execSync('gh api "repos/' + repo + '/actions/workflows/output-diff-check.yml/runs?head_sha=' + sha + '&per_page=5"', { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 })).workflow_runs) || [];
                  if (!list.length) return 'none';
                  return list.some(function (r) { return r.status !== 'completed'; }) ? 'running' : 'done';
                } catch (e) { return 'running'; }
              };
              // Wait for the diff run to complete, then read its verdict (it builds twice
              // and is slower than this gate's early run, so a snapshot would miss it).
              const deadline = Date.now() + 12 * 60 * 1000;
              let verdict = null;
              for (;;) {
                verdict = readVerdict();
                if (verdict) break;
                const s = runState();
                if (s === 'none') break;
                if (s === 'done') { try { execSync('sleep 8'); } catch (e) {} verdict = readVerdict(); break; }
                if (Date.now() > deadline) break;
                try { execSync('sleep 15'); } catch (e) {}
              }
              fastPass = verdict === 'NO_CHANGE';
            }
          }
          const pass = score >= REQUIRED_SCORE || fastPass;
          const desc = fastPass
            ? 'auto-pass: deps-dev + build-output-diff NO_CHANGE (bundle byte-identical)'
            : 'score ' + score + ' (' + a + ' approve, ' + b + ' block), need >= ' + REQUIRED_SCORE;
          console.log((pass ? 'PASS: ' : 'BLOCK: ') + desc);
          const res = spawnSync('gh', ['api','-X','POST','repos/' + repo + '/statuses/' + sha,
            '-f','state=' + (pass ? 'success' : 'failure'),'-f','context=review-score-gate','-f','description=' + desc],
            { encoding: 'utf8' });
          if (res.status !== 0) { console.error('failed to post status: ' + (res.stderr || '')); process.exit(1); }
          SCRIPT
          node "$RUNNER_TEMP/review-score.js"
