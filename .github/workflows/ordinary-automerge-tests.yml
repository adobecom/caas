name: Ordinary Automerge Tests
on:
  pull_request:
    paths:
      - '.github/automerge/**'
      - '.github/workflows/ordinary-*.yml'
permissions:
  contents: read
jobs:
  ordinary-automerge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/automerge/*.test.mjs
