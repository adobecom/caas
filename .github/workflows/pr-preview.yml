name: Build and publish a CaaS PR
# Invoked by the existing Pages workflow so the POC can run from a branch.
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '24'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      number: ${{ steps.pr.outputs.number }}
      version: ${{ steps.pr.outputs.version }}
    steps:
      - uses: actions/github-script@v7
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            if (!/^[1-9]\d*$/.test(process.env.PR_NUMBER)) throw new Error('Enter a positive PR number.');
            const { data: pr } = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('This POC only publishes PRs from branches in this repository.');
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('version', `pr-${pr.number}-${pr.head.sha.slice(0, 12)}`);
            core.info(`Building PR #${pr.number} (${pr.state}) at ${pr.head.sha}`);
  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR code runs with read-only access and no persisted git credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          RELEASE_TAG: ${{ needs.resolve.outputs.version }}
      - name: Package only browser assets
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          PR_SHA: ${{ needs.resolve.outputs.sha }}
          PREVIEW_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, shutil
          out = pathlib.Path('preview-bundle')
          out.mkdir()
          hashes = {}
          for name in ('main.min.js', 'app.css', 'react.umd.js', 'react.dom.umd.js'):
              source = pathlib.Path('dist') / name
              if source.is_symlink() or not source.is_file() or not source.stat().st_size:
                  raise ValueError(f'Missing or invalid asset: {source}')
              if name in ('main.min.js', 'app.css') and os.environ['PREVIEW_VERSION'] not in source.read_text()[:1000]:
                  raise ValueError(f'Preview version missing from asset banner: {name}')
              shutil.copyfile(source, out / name)
              hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          (out / 'manifest.json').write_text(json.dumps({
              'pr': int(os.environ['PR_NUMBER']), 'sha': os.environ['PR_SHA'],
              'version': os.environ['PREVIEW_VERSION'],
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'run': os.environ['GITHUB_RUN_ID'], 'sha256': hashes,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview-bundle/
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Find the currently published Pages artifact and preview store
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            let run;
            for await (const {data: deployments} of github.paginate.iterator(github.rest.repos.listDeployments, {...context.repo, environment: 'github-pages', per_page: 100})) {
              for (const deployment of deployments) {
                const {data: statuses} = await github.rest.repos.listDeploymentStatuses({...context.repo, deployment_id: deployment.id, per_page: 1});
                if (statuses[0]?.state !== 'success') continue;
                run = statuses[0].log_url?.match(/\/actions\/runs\/(\d+)/)?.[1];
                if (run) break;
              }
              if (run) break;
            }
            if (!run) throw new Error('No successful Pages deployment found. Run the normal Pages workflow first.');
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: Number(run)});
            if (!data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
              throw new Error('The published Pages artifact expired. Run the normal Pages workflow first.');
            }
            core.setOutput('run', run);
            try {
              await github.rest.git.getRef({...context.repo, ref: 'heads/qa-previews'});
              core.setOutput('store', 'true');
            } catch (e) {
              if (e.status !== 404) throw e;
              core.setOutput('store', 'false');
            }
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: published-artifact
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
      - name: Restore the published site
        run: |
          mkdir site
          python3 - <<'PY'
          import tarfile
          with tarfile.open('published-artifact/artifact.tar') as archive:
              archive.extractall('site', filter='data')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.previous.outputs.store == 'true' && 'qa-previews' || github.event.repository.default_branch }}
          path: saved
      - name: Initialize preview storage if needed
        if: steps.previous.outputs.store != 'true'
        working-directory: saved
        run: git switch --orphan qa-previews
      - uses: actions/download-artifact@v4
        with:
          name: pr-preview
          path: incoming
      - name: Save this PR and restore all retained PRs
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: |
          python3 control/scripts/pages/preview-files.py save incoming "saved/pr-builds/pr-$PR_NUMBER"
          python3 control/scripts/pages/preview-files.py restore saved/pr-builds site/pr-builds
      - name: Persist preview files
        working-directory: saved
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr-builds
          if ! git diff --cached --quiet; then
            git commit -m "Update preview for PR #$PR_NUMBER"
            git push origin HEAD:qa-previews
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify hosted files and report links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('incoming/manifest.json').read_text())
          base = os.environ['PAGE_URL'].rstrip('/') + '/pr-builds/pr-' + os.environ['PR_NUMBER']
          deadline = time.monotonic() + 900  # Pages serves assets with max-age=600.
          expected_files = dict(manifest['sha256'])
          expected_files['manifest.json'] = hashlib.sha256(Path('incoming/manifest.json').read_bytes()).hexdigest()
          for name, expected in expected_files.items():
              while time.monotonic() < deadline:
                  try:
                      data = urllib.request.urlopen(base + '/' + name + '?build=' + os.environ['GITHUB_RUN_ID'], timeout=30).read()
                      if hashlib.sha256(data).hexdigest() == expected: break
                  except Exception:
                      pass
                  time.sleep(10)
              else: raise RuntimeError(f'Published checksum did not match: {name}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## PR #{manifest['pr']} preview published\n\nCommit: `{manifest['sha']}`\n\n")
              for name in (*manifest['sha256'], 'manifest.json', 'index.html'):
                  summary.write(f'- [{name}]({base}/{name})\n')
          PY
