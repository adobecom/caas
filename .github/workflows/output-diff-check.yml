# Build Output Diff — Layer 1 (deterministic, advisory, non-blocking)
#
# Builds the base branch and the PR, normalizes away the build-timestamp banner,
# and compares the shipped bundle. Publishes the verdict THREE ways:
#   - the Actions run summary + a diff artifact (human view)
#   - a `build-output-diff` commit status on the PR head, whose description is
#     NO_CHANGE or CHANGED. That status is what the Feature QA agent reads so it
#     can report "bundle unchanged, safe" instead of a blind "skipped".
#
# Always succeeds — never blocks a merge. The status is informational (state is
# always success); the description carries the verdict.

name: Build Output Diff (advisory)

# Runs on EVERY pull request (no paths filter) so every PR gets a verdict — a
# change with no shipped-output impact (deps, refactors, CI/tooling) reports
# NO_CHANGE, which the Feature QA agent consults to say "safe" instead of "skipped".
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: output-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-output-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record PR head SHA
        run: echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 16.13.1
          cache: 'npm'

      - name: Install deps (PR)
        run: npm ci
      - name: Build (PR)
        run: npm run build
      - name: Save PR output
        run: |
          mkdir -p "$RUNNER_TEMP/head"
          cp -f dist/main.js dist/app.css "$RUNNER_TEMP/head/" 2>/dev/null || true

      - name: Check out base ref
        run: git checkout --force ${{ github.event.pull_request.base.sha }}
      - name: Install deps (base)
        run: npm ci
      - name: Build (base)
        run: npm run build
      - name: Save base output
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          cp -f dist/main.js dist/app.css "$RUNNER_TEMP/base/" 2>/dev/null || true

      - name: Restore PR checkout (for the compare script)
        run: git checkout --force "$HEAD_SHA"

      - name: Compare build output
        id: compare
        run: |
          chmod +x scripts/compare-build-output.sh
          scripts/compare-build-output.sh "$RUNNER_TEMP/base" "$RUNNER_TEMP/head" "$RUNNER_TEMP/diff"
          echo "result=$(cat "$RUNNER_TEMP/diff/result.txt")" >> "$GITHUB_OUTPUT"

      - name: Publish build-output-diff commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(cat "$RUNNER_TEMP/diff/result.txt")"
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context=build-output-diff \
            -f description="$RESULT" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish summary to the run
        run: cat "$RUNNER_TEMP/diff/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-diff
          path: ${{ runner.temp }}/diff
          if-no-files-found: warn
