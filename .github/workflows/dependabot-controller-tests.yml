name: Dependabot Controller Tests

on:
  pull_request:
    paths:
      - '.github/dependabot/**'
      - '.github/workflows/dependabot-controller-tests.yml'
      - '.github/workflows/dependabot-safe-automerge.yml'

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test policy and isolated controller queue transitions
        run: node --test .github/dependabot/*.test.mjs
